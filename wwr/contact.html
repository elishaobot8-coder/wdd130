<head>
  <meta charset="UTF-8">

    content="Welcome to the Rapid White Water Rafting, we offer the best experience ever don't miss out!">

  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

  <header>

    <div class="header-content">

      <img class="logo" src="images/logos.jpg" alt="White Water Rafting Company Logo">

      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
      </nav>

    </div>

  </header>


  <main>

    <!-- COMPANY INFORMATION -->
    <section class="company-info">

      <h1>White Water Rafting Company</h1>

      <p>
        <strong>Akwa Ibom Nigeria</strong><br>
        <strong>Etinan Capital</strong><br>
        <strong>+2348131876314</strong><br>
        <strong>elishaobot8@gmail.com</strong>
      </p>

    </section>


    <!-- CONTACT AREA -->
    <section class="contact-area">

      <!-- MAP -->
      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3975.6448196405354!2d7.850230873680582!3d4.830902640517761!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1067e3e00afb09b3%3A0x2c6f60aba7719241!2sWaterboard!5e0!3m2!1sen!2sng!4v1786229737353!5m2!1sen!2sng"
          width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>

      </div>


      <!-- CONTACT FORM -->
      <div class="contact-form">

        <form>

          <div class="form-row">

            <label for="name">Name</label>

            <input type="text" id="name" name="name" placeholder="Placeholder" required>

          </div>


          <div class="form-row">

            <label for="email">Email</label>

            <input type="email" id="email" name="email" placeholder="Placeholder" required>

          </div>


          <fieldset>

            <legend>Message Purpose</legend>

            <label>
              <input type="radio" name="purpose" value="general">
              General Inquiry
            </label>

            <label>
              <input type="radio" name="purpose" value="reservation">
              Reservation Question
            </label>

            <label>
              <input type="radio" name="purpose" value="suggestion">
              Website Suggestion
            </label>

          </fieldset>


          <div class="message">

            <label for="message">Message</label>

            <textarea id="message" name="message" placeholder="Type here" required></textarea>

          </div>


          <label class="newsletter">

            <input type="checkbox" name="newsletter">

            Please Subscribe me to the monthly newsletter

          </label>


          <button type="submit">
            Get in Touch!
          </button>

        </form>

      </div>

    </section>


    <!-- EMPLOYEE SECTION -->
    <section class="employees">

      <h2>We Are Here to Serve You</h2>

      <div class="employee-container">


        <figure>

          <img src="images/adventure-5.jpg" alt="Employee Profile">

          <figcaption>Employee Profile</figcaption>

        </figure>


        <figure>

          <img src="images/history.jpg" alt="Employee Profile">

          <figcaption>Employee Profile</figcaption>

        </figure>


        <figure>

          <img src="images/adventure-3.jpg" alt="Employee Profile">

          <figcaption>Employee Profile</figcaption>

        </figure>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>

    <p>
    <p> ©2026 | Rapids! | Elisha Joseph Obot</p>
    </p>

    <div class="social-media">
      <nav>
        <a href="https//facebook.com" aria-label="Facebook">
          <img src="images/facebook.svg" alt="Facebook">
        </a>

        <a href="https://instagram.com" aria-label="Instagram">
          <img src="images/instagram-square.svg" alt="Instagram">
        </a>
        aria-l
        <a href="https://linkedin.com" abel="linkedin">
          <img src="images/linkedin-square.svg" alt="linkedin">
        </a>
      </nav>


    </div>

  </footer>

</body>

</html>
